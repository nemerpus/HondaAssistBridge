plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nemerpus.hondaassistbridge'
    compileSdk 36

    defaultConfig {
        applicationId 'com.nemerpus.hondaassistbridge'
        minSdk 26
        targetSdk 36
        versionCode 23
        versionName '0.15.0-panas-micro-onoff'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
